<div class="custom-search-container">
  <div class="custom-search-form" [formGroup]="customPaletteSearch">

    <div class="model-selector">
      <mat-button-toggle-group formControlName="contrastModel" aria-label="Contrast model" [hideSingleSelectionIndicator]="true">
        <mat-button-toggle value="APCA">APCA</mat-button-toggle>
        <mat-button-toggle value="WCAG">WCAG</mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <mat-form-field class="shortField">
      <mat-label>Font-size</mat-label>
      <mat-select formControlName="size" placeholder="Size">
        <mat-option *ngFor="let i of isAPCA ? apcaSizes : (colorPalettesSizes$ | async)" [value]="i">
          {{i}} px
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field class="mediumField">
      <mat-label>Font-weight</mat-label>
      <mat-select formControlName="fontWeight" placeholder="Weight">
        <mat-option *ngFor="let fw of isAPCA ? apcaWeights : (colorPalettesFontWeights$ | async)" [value]="fw">
          {{fw}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <cm-accessibility-info-panel *ngIf="!isAPCA"></cm-accessibility-info-panel>
</div>
