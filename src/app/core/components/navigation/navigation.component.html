<mat-toolbar [ngClass]="{'fixed-header':currentHeaderType === HeaderType.COLOR_PALETTE}">
  <mat-toolbar-row>
    <ng-container *ngIf="currentHeaderType === HeaderType.COLOR_PALETTE">
      <div class="toolbar-left">
          <div class="title"><img src="favicon.ico" class="Appicon"><div>Colors for All</div></div>
        </div>
        <div class="toolbar-right">
          <button type="button" mat-stroked-button color="primary" class="button-upload" (click)="paletteFile.click()">
            <mat-icon>upload_file</mat-icon>
            <span>Upload file</span>
          </button>
          <input #paletteFile type="file" accept=".json,application/json" hidden (change)="createColorPalette(paletteFile)">
          <button mat-flat-button color="primary" class="button-create" (click)="createColorPalette()">
            <mat-icon class="icon-create">add</mat-icon>
            <span>Create</span>
          </button>
          <button type="button" aria-label="Help" mat-icon-button (click)="goToHelp()">
            <mat-icon aria-label="Help">
              help_outline
            </mat-icon>
          </button>
      </div>

    </ng-container>

    <ng-container *ngIf="currentHeaderType === HeaderType.DETAILED_COLOR_PALETTE">
      <div class="toolbar-left">
        <div class="title" [ngClass]="{'truncate-small':currentScreenSize === ScreenSize.MEDIUM,'truncate':currentScreenSize === ScreenSize.SMALL}">{{selectedColorPaletteSnapShot?.title}}</div>
      </div>
      <cm-matrix-custom-form class="custom-search desktop-settings"></cm-matrix-custom-form>
      <div class="toolbar-right">
        <button type="button" mat-icon-button [matMenuTriggerFor]="navigationMenu" aria-label="More options" title="More options">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #navigationMenu="matMenu">
          <button mat-menu-item (click)="downloadColorPalette()">
            <mat-icon>download</mat-icon>
            <span>Download</span>
          </button>
          <button mat-menu-item (click)="editColorPalette(selectedColorPaletteSnapShot?.id)">
            <mat-icon>edit</mat-icon>
            <span>Edit</span>
          </button>
          <button mat-menu-item (click)="duplicateColorPalette(selectedColorPaletteSnapShot?.id)">
            <mat-icon>file_copy</mat-icon>
            <span>Duplicate</span>
          </button>
          <button mat-menu-item (click)="deleteColorPalette(selectedColorPaletteSnapShot?.id)">
            <mat-icon>delete</mat-icon>
            <span>Delete</span>
          </button>
        </mat-menu>
        <button type="button" aria-label="Close" title="Close" mat-icon-button (click)="goBackToColorPaletteList()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </ng-container>

    <ng-container *ngIf="currentHeaderType === HeaderType.HELP">
      <div class="toolbar-left">
        <button mat-icon-button (click)="goBackToColorPaletteList()">
          <mat-icon aria-label="Back to main view">
            arrow_back
          </mat-icon>

        </button>
        <div class="title">Help</div>
      </div>

    </ng-container>
  </mat-toolbar-row>
  <mat-toolbar-row class="settings-row" *ngIf="currentHeaderType === HeaderType.DETAILED_COLOR_PALETTE">
    <cm-matrix-custom-form class="custom-search"></cm-matrix-custom-form>
  </mat-toolbar-row>
</mat-toolbar>

<ng-content></ng-content>
