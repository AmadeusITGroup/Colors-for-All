<mat-toolbar [ngClass]="{'fixed-header':currentHeaderType === HeaderType.COLOR_PALETTE}">
  <mat-toolbar-row [class.detail-header-row]="currentHeaderType === HeaderType.DETAILED_COLOR_PALETTE">
    <ng-container *ngIf="currentHeaderType === HeaderType.COLOR_PALETTE">
      <div class="toolbar-left">
        <button *ngIf="currentScreenSize === ScreenSize.SMALL" type="button" mat-icon-button class="mobile-menu-trigger"
          [matMenuTriggerFor]="homeMobileMenu" aria-label="Header menu" matTooltip="Header menu">
          <mat-icon>menu</mat-icon>
        </button>
        <div class="title"><img src="favicon.ico" class="Appicon"><div>Colors for All</div></div>
      </div>
      <div class="toolbar-right" [class.mobile-header-hidden]="currentScreenSize === ScreenSize.SMALL">
          <button type="button" mat-stroked-button color="primary" class="button-upload" matTooltip="Upload color palette" (click)="paletteFile.click()">
            <mat-icon>upload_file</mat-icon>
            <span>Upload file</span>
          </button>
          <input #paletteFile type="file" accept=".json,application/json" hidden (change)="createColorPalette(paletteFile)">
          <button mat-flat-button color="primary" class="button-create" matTooltip="Create color palette" (click)="createColorPalette()">
            <mat-icon class="icon-create">add_circle</mat-icon>
            <span>Create</span>
          </button>
          <button type="button" aria-label="Help" mat-icon-button matTooltip="Help" (click)="goToHelp()">
            <mat-icon aria-label="Help">
              help_outline
            </mat-icon>
          </button>
      </div>
      <mat-menu #homeMobileMenu="matMenu" class="mobile-header-menu">
        <button mat-menu-item (click)="paletteFile.click()"><mat-icon>upload_file</mat-icon><span>Upload file</span></button>
        <button mat-menu-item (click)="createColorPalette()"><mat-icon>add_circle</mat-icon><span>Create</span></button>
        <button mat-menu-item (click)="goToHelp()"><mat-icon>help_outline</mat-icon><span>Help</span></button>
      </mat-menu>

    </ng-container>

    <ng-container *ngIf="currentHeaderType === HeaderType.DETAILED_COLOR_PALETTE">
      <div class="toolbar-left">
        <button *ngIf="currentScreenSize === ScreenSize.SMALL" type="button" mat-icon-button class="mobile-menu-trigger"
          [matMenuTriggerFor]="matrixMobileMenu" aria-label="Header menu" matTooltip="Header menu">
          <mat-icon>menu</mat-icon>
        </button>
        <div class="title" [ngClass]="{'truncate-small':currentScreenSize === ScreenSize.MEDIUM,'truncate':currentScreenSize === ScreenSize.SMALL}">{{selectedColorPaletteSnapShot?.title}}</div>
      </div>
      <cm-matrix-custom-form *ngIf="currentScreenSize !== ScreenSize.SMALL" class="custom-search"></cm-matrix-custom-form>
      <div class="toolbar-right" [class.mobile-header-hidden]="currentScreenSize === ScreenSize.SMALL">
        <button type="button" mat-icon-button class="filter-button" [matMenuTriggerFor]="filterMenu" aria-label="Filters" matTooltip="Filters">
          <mat-icon>filter_list</mat-icon>
          <span *ngIf="filteredOutItemCount > 0" class="filter-count" aria-hidden="true">{{filteredOutItemCount}}</span>
        </button>
        <mat-menu #filterMenu="matMenu" class="matrix-filter-menu">
          <div class="matrix-filter-options" role="group" [attr.aria-label]="isAPCA ? 'Usage filters' : 'WCAG level filters'"
            (click)="$event.stopPropagation()">
            <ng-container *ngIf="filterCounts$ | async as counts">
            <ng-container *ngIf="isAPCA; else wcagFilterOptions">
              <ng-container *ngFor="let usage of apcaUsageOptions">
                <mat-checkbox *ngIf="isAPCAUsageFilterVisible(usage)" [checked]="isAPCAUsageSelected(usage)"
                  (change)="setAPCAUsage(usage, $event.checked)">Lc ≥ {{apcaUsageMinLc[usage]}} | {{usage}} ({{counts.apcaUsages[usage] || 0}})</mat-checkbox>
              </ng-container>
            </ng-container>
            <ng-template #wcagFilterOptions>
              <mat-checkbox *ngFor="let level of wcagLevelOptions" [checked]="isWCAGLevelSelected(level)"
                (change)="setWCAGLevel(level, $event.checked)">{{level}} ({{counts.wcagLevels[level] || 0}})</mat-checkbox>
            </ng-template>
            </ng-container>
          </div>
        </mat-menu>
        <button type="button" mat-icon-button [matMenuTriggerFor]="navigationMenu" aria-label="More options" matTooltip="More options">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #navigationMenu="matMenu" class="navigation-actions-menu">
          <button mat-menu-item [matMenuTriggerFor]="accessibleExportMenu" matTooltip="Export accessible colors">
            <mat-icon>file_export</mat-icon>
            <span>Export accessible colors</span>
          </button>
          <mat-menu #accessibleExportMenu="matMenu">
            <button mat-menu-item (click)="exportAccessibleCombinations('json')"><span>JSON</span></button>
            <button mat-menu-item (click)="exportAccessibleCombinations('xls')"><span>XLS</span></button>
            <button mat-menu-item (click)="exportAccessibleCombinations('csv')"><span>CSV</span></button>
            <button mat-menu-item (click)="exportAccessibleCombinations('txt')"><span>TXT</span></button>
            <button mat-menu-item (click)="exportAccessibleCombinations('pdf')"><span>PDF</span></button>
          </mat-menu>
          <button mat-menu-item matTooltip="Download this palette as JSON" (click)="downloadColorPalette()">
            <mat-icon>download</mat-icon>
            <span>Download</span>
          </button>
          <button mat-menu-item matTooltip="Edit this palette" (click)="editColorPalette(selectedColorPaletteSnapShot?.id)">
            <mat-icon>edit</mat-icon>
            <span>Edit</span>
          </button>
          <button mat-menu-item matTooltip="Duplicate this palette" (click)="duplicateColorPalette(selectedColorPaletteSnapShot?.id)">
            <mat-icon>file_copy</mat-icon>
            <span>Duplicate</span>
          </button>
          <button mat-menu-item matTooltip="Delete this palette" (click)="deleteColorPalette(selectedColorPaletteSnapShot?.id)">
            <mat-icon>delete</mat-icon>
            <span>Delete</span>
          </button>
        </mat-menu>
        <mat-menu #matrixMobileMenu="matMenu" class="mobile-header-menu">
          <button mat-menu-item [matMenuTriggerFor]="mobileModelMenu">
            <span>Model</span><span class="mobile-menu-value">{{selectedMatrixSnapshot?.contrastModel || 'WCAG'}}</span><mat-icon>chevron_right</mat-icon>
          </button>
          <button *ngIf="isAPCA" mat-menu-item [matMenuTriggerFor]="mobileContentMenu">
            <span>Usage</span><span class="mobile-menu-value">{{apcaContentMode}}</span><mat-icon>chevron_right</mat-icon>
          </button>
          <button *ngIf="!isAPCA || apcaContentMode === 'Text'" mat-menu-item [matMenuTriggerFor]="mobileSizeMenu">
            <span>Size</span><span class="mobile-menu-value">{{selectedMatrixSnapshot?.size}} px</span><mat-icon>chevron_right</mat-icon>
          </button>
          <button *ngIf="!isAPCA || apcaContentMode === 'Text'" mat-menu-item [matMenuTriggerFor]="mobileWeightMenu">
            <span>Weight</span><span class="mobile-menu-value">{{selectedMatrixSnapshot?.fontWeight}}</span><mat-icon>chevron_right</mat-icon>
          </button>
          <button mat-menu-item [matMenuTriggerFor]="filterMenu">
            <span>Filters</span><span *ngIf="filteredOutItemCount" class="mobile-menu-value">{{filteredOutItemCount}}</span><mat-icon>chevron_right</mat-icon>
          </button>
          <button mat-menu-item [matMenuTriggerFor]="navigationMenu">
            <span>More actions</span><mat-icon>chevron_right</mat-icon>
          </button>
          <button mat-menu-item (click)="goBackToColorPaletteList()">
            <mat-icon>close</mat-icon><span>Close</span>
          </button>
        </mat-menu>
        <mat-menu #mobileModelMenu="matMenu">
          <button mat-menu-item (click)="setMatrixModel('WCAG')">WCAG</button>
          <button mat-menu-item (click)="setMatrixModel('APCA')">APCA</button>
        </mat-menu>
        <mat-menu #mobileContentMenu="matMenu">
          <button mat-menu-item (click)="setAPCAContentMode('Text')">Text</button>
          <button mat-menu-item (click)="setAPCAContentMode('Non-text')">Non-text</button>
        </mat-menu>
        <mat-menu #mobileSizeMenu="matMenu">
          <ng-container *ngIf="isAPCA; else mobileWcagSizes">
            <button mat-menu-item *ngFor="let size of apcaSizes" (click)="setMatrixSize(size)">{{size}} px</button>
          </ng-container>
          <ng-template #mobileWcagSizes>
            <button mat-menu-item *ngFor="let size of colorPalettesSizes$ | async" (click)="setMatrixSize(size)">{{size}} px</button>
          </ng-template>
        </mat-menu>
        <mat-menu #mobileWeightMenu="matMenu">
          <ng-container *ngIf="isAPCA; else mobileWcagWeights">
            <button mat-menu-item *ngFor="let weight of apcaWeights" (click)="setMatrixWeight(weight)">{{weight}}</button>
          </ng-container>
          <ng-template #mobileWcagWeights>
            <button mat-menu-item *ngFor="let weight of colorPalettesFontWeights$ | async" (click)="setMatrixWeight(weight)">{{weight}}</button>
          </ng-template>
        </mat-menu>
        <button type="button" aria-label="Close" mat-icon-button matTooltip="Close" (click)="goBackToColorPaletteList()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </ng-container>

    <ng-container *ngIf="currentHeaderType === HeaderType.HELP">
      <div class="toolbar-left">
        <button mat-icon-button (click)="goBackToColorPaletteList()">
          <mat-icon aria-label="Back to main view">
            arrow_back
          </mat-icon>

        </button>
        <div class="title">Help</div>
      </div>

    </ng-container>
  </mat-toolbar-row>
</mat-toolbar>

<ng-content></ng-content>
