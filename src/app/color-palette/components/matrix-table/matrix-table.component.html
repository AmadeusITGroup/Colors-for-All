<div class="table-container">
  <table [class.has-color-names]="hasColorNames">
    <thead>
      <tr>
        <th class="first-header-cell">
          <div class="header-title">{{selectedMatrix?.size}} px</div>
          <div class="header-fontweight">{{selectedMatrix?.fontWeight}}</div>
          </th>
      <th scope="col" class="color-header text-header" [title]="(colorPalette?.names?.[columnIndex] ? colorPalette.names[columnIndex] + ' / ' : '') + backgroundColor" *ngFor="let backgroundColor of colorPalette?.data; let columnIndex = index" [style.backgroundColor]="backgroundColor">
          <div class="color-label">
            <span *ngIf="colorPalette?.names?.[columnIndex]" class="color-name">{{colorPalette.names[columnIndex]}}</span>
            <span class="color-hex">{{backgroundColor}}</span>
          </div>
      </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let backgroundColor of colorPalette?.data; let rowIndex = index">
          <th scope="row" [title]="(colorPalette?.names?.[rowIndex] ? colorPalette.names[rowIndex] + ' / ' : '') + backgroundColor" class="text-header" [style.backgroundColor]="backgroundColor">
            <div class="color-label row-label">
              <span *ngIf="colorPalette?.names?.[rowIndex]" class="color-name">{{colorPalette.names[rowIndex]}}</span>
              <span class="color-hex">{{backgroundColor}}</span>
            </div>
          </th>
          <td [style.backgroundColor]="backgroundColor" *ngFor="let foregroundColor of colorPalette?.data">
            <cm-matrix-cell [numberOfColors]="colorPalette?.data.length" [data]="computeColorMatrixData(backgroundColor,foregroundColor,selectedMatrix.size,selectedMatrix.fontWeight,selectedMatrix.contrastModel)"></cm-matrix-cell>
          </td>
      </tr>
    </tbody>
  </table>
</div>
