<div class="modal-container">
  <h2 mat-dialog-title>Delete palette</h2>
  <div mat-dialog-content>
    <p>You are about to delete the <strong>{{data.title}}</strong> palette.</p>
    <p>All corresponding colors will be lost.</p>
  </div>
  <div mat-dialog-actions class="delete-dialog-actions">
    <button mat-button (click)="cancel()">Keep</button>
    <button mat-raised-button color="primary" (keyup.enter)="confirmColorPaletteDeletion()" (click)="confirmColorPaletteDeletion()">Delete</button>
  </div>
</div>
